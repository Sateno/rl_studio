name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.7"
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install system dependencies
      timeout-minutes: 5
      run: |
        sudo apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
        sudo apt-get install -y libcairo2-dev libpango1.0-dev ffmpeg portaudio19-dev
    - name: Install Python dependencies
      run: uv sync --dev --frozen
    - name: Add virtual environment tools to PATH
      run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
    - name: Check formatting
      run: uv run ruff format --check .
    - name: Lint
      run: uv run ruff check .
    - name: Typecheck
      run: uv run ty check src/manim_voiceover
    - name: Mypy
      run: uv run mypy
    - name: Test with coverage
      run: uv run pytest --cov=manim_voiceover --cov-config=pyproject.toml --cov-fail-under=85
    - name: Verify Linux narration demos
      run: |
        bash scripts/dev.sh demo local-wav
        bash scripts/dev.sh demo cue-bindings
        bash scripts/dev.sh demo bookmarks
    - name: Check duplication
      run: uv run slophammer-py dry .
    - name: Check mutations
      run: |
        uv run mutmut run --max-children 1
        uv run python scripts/check_mutmut_results.py
        rm -rf mutants
    - name: Audit dependencies
      run: uv run pip-audit
    - name: Run Slophammer
      run: |
        uv run slophammer-py check .
        uv run slophammer-py check . --execute

  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
    - uses: actions/checkout@v6
    - uses: conda-incubator/setup-miniconda@v3
      with:
        miniforge-version: latest
        activate-environment: ""
        auto-activate-base: false
    - name: Create the Windows Conda environment
      run: conda create -y -n rl_studio_win --override-channels -c conda-forge python=3.12 uv=0.13.7 ffmpeg=9.0.2
    - name: Run Windows tests and narration renders
      shell: pwsh
      run: |
        foreach ($action in 'sync', 'status', 'test-all', 's01', 's02', 'bookmarks') {
          conda run --no-capture-output -n rl_studio_win powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\local.ps1 $action
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
